events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Leaky Bucket Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    upstream api_cluster {
        server api:8000;
    }

    # ================================================================
    # BLOCK 1: Port 80 (HTTP) -> Automatic 301 Permanent Redirect
    # ================================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ================================================================
    # BLOCK 2: Port 443 (HTTPS) -> Hardened TLS 1.3 + OWASP Headers
    # ================================================================
    server {
        listen 443 ssl;
        server_name _;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # TLS Protocols & Cipher Suites
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # TLS Session Caching (High Performance)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # OWASP Production Hardening Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 1. Frontend Web UI (Encrypted)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. High-Concurrency API Endpoints (Encrypted + Rate Limited)
        location ~ ^/(tickets|book|simulate|metrics) {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
