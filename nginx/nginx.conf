events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Leaky Bucket Rate Limiting: 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    upstream api_cluster {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # 1. Frontend Web UI (Served directly by NGINX static micro-tier)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. High-Concurrency API Endpoints (Proxied to FastAPI with Rate Limiting)
        location ~ ^/(tickets|book|simulate|metrics) {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
