worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Production log format with response times
    log_format production '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log production;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # 1. Rate Limiting Zone: 5 requests/sec per IP tracked in a 10MB memory zone
    limit_req_zone $binary_remote_addr zone=flash_sale_limit:10m rate=5r/s;
    limit_req_status 429;

    upstream ticketpulse_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Proxy-By "TicketPulse-NGINX-Edge" always;

        # Healthcheck endpoint (exempt from rate limits)
        location /health {
            proxy_pass http://ticketpulse_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Booking endpoint: protected by Leaky Bucket rate limiter
        location /book {
            limit_req zone=flash_sale_limit burst=10 nodelay;

            proxy_pass http://ticketpulse_backend/book;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Default catch-all routing
        location / {
            proxy_pass http://ticketpulse_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
